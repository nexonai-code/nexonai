[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexongraph"
version = "1.0.0"
description = "Turns a folder (code, Markdown, PDF, Word, HTML) into a queryable knowledge graph. Local first, optional LLM pass (Ollama or online APIs)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "NexonAI Consulting SRL" }]
dependencies = [
  "networkx>=3.2",
  "numpy>=1.26",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.7",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
nexongraph = "nexongraph.cli:main"

[tool.setuptools]
packages = ["nexongraph"]

[tool.setuptools.package-data]
nexongraph = ["static/*"]
